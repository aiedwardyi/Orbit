name: Dev build

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [review-base]

permissions:
  contents: read

concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  prepare:
    name: Pin the dev commit and check formats
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      version: ${{ steps.pin.outputs.version }}
      held: ${{ steps.pin.outputs.held }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: pin
        run: node scripts/dev-build.mjs

  windows:
    name: Windows x64 dev build
    needs: prepare
    if: needs.prepare.outputs.held == 'false'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        shell: bash
        run: rm -rf dist dist-server release
      - name: Bake the Google sign-in client
        env:
          WINK_GOOGLE_CLIENT_ID: ${{ secrets.WINK_GOOGLE_CLIENT_ID }}
          WINK_GOOGLE_CLIENT_SECRET: ${{ secrets.WINK_GOOGLE_CLIENT_SECRET }}
          WINK_GOOGLE_WEB_CLIENT_ID: ${{ vars.WINK_GOOGLE_WEB_CLIENT_ID }}
          WINK_TEAM_RELAY: ${{ vars.WINK_TEAM_RELAY }}
          WINK_TEAM_OWNER: ${{ secrets.WINK_TEAM_OWNER }}
        run: node scripts/write-google-client.mjs
      - name: Set the dev version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm pkg set "version=$env:VERSION"
      - run: pnpm package:win -c.publish.channel=dev
      - name: Verify the dev feed channel
        shell: bash
        run: |
          [ -f release/dev.yml ] || { echo "::error::missing dev.yml"; exit 1; }
          [ ! -e release/latest.yml ] || { echo "::error::dev build emitted latest.yml"; exit 1; }
      - name: Verify the packaged tree and start the packaged server
        shell: bash
        run: |
          res=release/win-unpacked/resources
          [ -f "$res/server/packaged-boot.js" ] || { echo "::error::missing server/packaged-boot.js"; exit 1; }
          [ -f "$res/server/index.js" ] || { echo "::error::missing server/index.js"; exit 1; }
          [ -f "$res/ui/index.html" ] || { echo "::error::missing ui/index.html"; exit 1; }
          [ -f "$res/cloudflared/cloudflared.exe" ] || { echo "::error::missing cloudflared.exe"; exit 1; }
          [ -f "$res/licenses/cloudflared-LICENSE.txt" ] || { echo "::error::missing cloudflared license"; exit 1; }
          [ -f "$res/licenses/cloudflared-README.md" ] || { echo "::error::missing cloudflared provenance"; exit 1; }
          expected=c29eee2b121f5436a642eed69fd9767da7e7b8c510fa50aaa130337f931357b5
          actual=$(sha256sum "$res/cloudflared/cloudflared.exe" | cut -d' ' -f1)
          [ "$actual" = "$expected" ] || { echo "::error::cloudflared hash is $actual"; exit 1; }
          "$res/cloudflared/cloudflared.exe" version | grep -Fq "cloudflared version 2026.8.2 " || {
            echo "::error::cloudflared has the wrong version"; exit 1; }
          [ -f "$res/app-update.yml" ] || { echo "::error::missing app-update.yml"; exit 1; }
          grep -q "owner: aiedwardyi" "$res/app-update.yml" || { echo "::error::wrong update owner"; exit 1; }
          expected_repo=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { parse } from "yaml"; console.log(parse(readFileSync("electron-builder.yml", "utf8")).publish[0].repo);')
          grep -q "repo: $expected_repo" "$res/app-update.yml" || { echo "::error::wrong update repo"; exit 1; }
          if grep -Eq "openmausbot-releases|milind-soni" "$res/app-update.yml"; then
            echo "::error::app-update.yml still points at the upstream feed"; exit 1
          fi
          if grep -q "publisherName" "$res/app-update.yml"; then
            echo "::error::publisherName on an unsigned build breaks every update"; exit 1
          fi
          node scripts/smoke-packaged-relay.mjs "$res"
          HOME="$RUNNER_TEMP/smoke" USERPROFILE="$RUNNER_TEMP/smoke" OMB_PORT=21987 \
            node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1 && { kill $pid; exit 0; }
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::the packaged server never served /api/health"
          cat "$RUNNER_TEMP/server.log" || true
          exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-dev
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/dev.yml
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Verify and publish the dev prerelease
    needs: [prepare, windows]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-dev
          path: assets
      - name: Verify the dev feed hash against the actual bytes
        run: |
          cd assets
          node --input-type=module - <<'EOF'
          import { createHash } from "node:crypto";
          import { readFileSync, readdirSync, statSync, existsSync } from "node:fs";
          const sha512 = (f) => createHash("sha512").update(readFileSync(f)).digest("base64");
          let bad = 0;
          let entries = 0;
          const feed = "dev.yml";
          if (!existsSync(feed)) { console.error(`MISSING ${feed}`); process.exit(1); }
          const text = readFileSync(feed, "utf8");
          for (const [, url, hash, size] of text.matchAll(/url:\s+(\S+)[\s\S]*?sha512:\s+(\S+)\n\s+size:\s+(\d+)/g)) {
            entries++;
            if (!existsSync(url)) { console.error(`MISSING ${url} (listed in ${feed})`); bad++; continue; }
            const okHash = sha512(url) === hash;
            const okSize = statSync(url).size === Number(size);
            if (!okHash || !okSize) { console.error(`MISMATCH ${url} in ${feed}`); bad++; }
            else console.log(`ok ${url}`);
          }
          if (!entries) { console.error(`NO ASSETS listed in ${feed}`); process.exit(1); }
          if (bad) process.exit(1);
          console.log(`\nWindows dev feed verified; ${readdirSync(".").length} assets staged`);
          EOF
      - name: Create, upload and publish the dev prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          cd assets
          tag="v$VERSION"
          gh release create "$tag" --repo aiedwardyi/Orbit --target "$SHA" \
            --draft --prerelease --latest=false --title "Wink $VERSION" \
            --notes "Dev build from aiedwardyi/Orbit@$SHA."
          gh release upload "$tag" *.exe *.exe.blockmap dev.yml --repo aiedwardyi/Orbit
          gh release edit "$tag" --repo aiedwardyi/Orbit --draft=false --prerelease --latest=false
          gh release view "$tag" --repo aiedwardyi/Orbit --json isPrerelease,isDraft \
            --jq '.isPrerelease and (.isDraft | not)' | grep -qx true
      - name: Keep the newest three dev prereleases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate --slurp 'repos/aiedwardyi/Orbit/releases?per_page=100' \
            --jq 'add | map(select(.prerelease and (.draft | not) and (.tag_name | test("-dev\\.")))) | sort_by(.published_at) | reverse | .[3:][].tag_name' \
            > "$RUNNER_TEMP/old-dev-tags"
          while IFS= read -r tag; do
            gh release delete "$tag" --repo aiedwardyi/Orbit --cleanup-tag --yes
          done < "$RUNNER_TEMP/old-dev-tags"
