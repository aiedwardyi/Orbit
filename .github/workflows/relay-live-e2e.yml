# Phone access end to end on a fresh Windows machine: the released 1.0.147
# installer, the packaged server, the live relay and a phone-sized browser.
# Pushes run the mode in e2e/relay-live/acme.txt; staging certificates keep
# the shared Let's Encrypt production limit for the final run.
# simulate-fix.txt (pushes) or simulate_fix patches the released server bundle,
# so those runs test patched bits. release_run tests a release.yml build as built.
name: Relay live E2E

on:
  push:
    branches: [e2e/relay-live]
  workflow_dispatch:
    inputs:
      acme:
        description: "Certificate authority for this run"
        required: false
        type: choice
        options: [staging, production]
        default: staging
      simulate_fix:
        description: "Prepend the createRequire line to the released server bundle (patched bits)"
        required: false
        type: boolean
        default: false
      release_run:
        description: "release.yml run id in aiedwardyi/Orbit: test its windows-release artifact, unpatched"
        required: false
        type: string
        default: ""
      stop_after_b:
        description: "Stop once the packaged server is up (steps a and b)"
        required: false
        type: boolean
        default: false
      keep_awake:
        description: "Test the full Wink app's Windows power request only"
        required: false
        type: boolean
        default: false
      version:
        description: "Published installer version when release_run is empty"
        required: false
        type: string
        default: "1.0.147"

permissions:
  contents: read
  actions: read

# Runs that stop after b never reach the relay, so they don't wait for one that does.
concurrency:
  group: relay-live-e2e${{ inputs.stop_after_b && !inputs.keep_awake && '-boot' || '' }}
  cancel-in-progress: false

jobs:
  flow:
    name: Phone access flow
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.keep_awake }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version || '1.0.147' }}
      RELEASE_RUN: ${{ inputs.release_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Download the installer and check it against latest.yml
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/artifacts"
          cd "$RUNNER_TEMP/release"
          if [ -n "$RELEASE_RUN" ]; then
            gh run download "$RELEASE_RUN" -R aiedwardyi/Orbit -n windows-release -D .
          else
            base="https://github.com/aiedwardyi/orbit-releases/releases/download/v$VERSION"
            curl -fsSL --retry 3 -o "Wink-$VERSION-setup.exe" "$base/Wink-$VERSION-setup.exe"
            curl -fsSL --retry 3 -o latest.yml "$base/latest.yml"
          fi
          ls -l
          node --input-type=module - <<'EOF'
          import { createHash } from "node:crypto";
          import { appendFileSync, readFileSync, statSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const feed = readFileSync("latest.yml", "utf8");
          const version = /^version:\s+(\S+)/m.exec(feed)?.[1] ?? null;
          const run = process.env.RELEASE_RUN;
          const exe = `Wink-${run ? version : process.env.VERSION}-setup.exe`;
          const entry = [...feed.matchAll(/url:\s+(\S+)[\s\S]*?sha512:\s+(\S+)\n\s+size:\s+(\d+)/g)].find(([, url]) => url === exe);
          if (!entry) { console.error(`latest.yml does not list ${exe}`); process.exit(1); }
          const actual = createHash("sha512").update(readFileSync(exe)).digest("base64");
          const size = statSync(exe).size;
          const result = {
            source: run ? `release.yml run ${run} (windows-release artifact)` : `orbit-releases v${process.env.VERSION}`,
            exe,
            version,
            sha512Match: actual === entry[2],
            sizeMatch: size === Number(entry[3]),
            size,
            sha512Prefix: actual.slice(0, 16),
          };
          writeFileSync(`${process.env.RUNNER_TEMP}/artifacts/a-release.json`, `${JSON.stringify(result, null, 2)}\n`);
          console.log(JSON.stringify(result));
          if (!result.sha512Match || !result.sizeMatch || !version || (!run && version !== process.env.VERSION)) process.exit(1);
          appendFileSync(process.env.GITHUB_ENV, `INSTALLER=${join(process.cwd(), exe)}\nBITS=${result.source}, Wink ${version}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `**Bits:** ${result.source}, \`${exe}\` (Wink ${version}), sha512 and size match its latest.yml\n\n`);
          EOF
      - name: Extract the installer
        shell: bash
        run: |
          7z x -y -o"$RUNNER_TEMP/nsis" "$INSTALLER" > /dev/null
          app=$(find "$RUNNER_TEMP/nsis" -name 'app-64.7z' | head -n 1)
          [ -n "$app" ] || { echo "::error::no app-64.7z in the installer"; find "$RUNNER_TEMP/nsis" -maxdepth 2; exit 1; }
          7z x -y -o"$RUNNER_TEMP/wink" "$app" > /dev/null
          res="$RUNNER_TEMP/wink/resources"
          for f in server/packaged-boot.js server/index.js ui/index.html ui/pair.html; do
            [ -f "$res/$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          ls "$RUNNER_TEMP/wink"
      - name: Simulate the relay client fix
        shell: bash
        env:
          SIMULATE_FIX: ${{ inputs.simulate_fix }}
        run: |
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || SIMULATE_FIX=$(tr -d '[:space:]' < e2e/relay-live/simulate-fix.txt)
          if [ "$SIMULATE_FIX" != true ] || [ -n "$RELEASE_RUN" ]; then
            [ "$SIMULATE_FIX" = true ] && echo "::notice::simulate_fix ignored: a release_run build is tested as built"
            echo "SERVER_PATCHED=no" >> "$GITHUB_ENV"
            echo "**Server:** as shipped, not patched" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          line='import { createRequire as __winkCreateRequire } from "node:module"; const require = __winkCreateRequire(import.meta.url);'
          for f in index.js packaged-boot.js; do
            file="$RUNNER_TEMP/wink/resources/server/$f"
            if awk 'NR > 5 { exit } /createRequire/ { found = 1 } END { exit !found }' "$file"; then
              echo "::error::$f already starts with a createRequire banner; run this build without simulate_fix"; exit 1
            fi
            { printf '%s\n' "$line"; cat "$file"; } > "$file.patched"
            mv "$file.patched" "$file"
            head -n 2 "$file" | cut -c 1-160
          done
          echo "SERVER_PATCHED=yes" >> "$GITHUB_ENV"
          echo "::warning::Patched bits, not the release: the createRequire line was prepended to resources/server/index.js and packaged-boot.js"
          {
            echo "## Patched server, not the released bits"
            echo "After extracting the installer, this line was prepended to \`resources/server/index.js\` and \`resources/server/packaged-boot.js\`:"
            echo '```js'
            echo "$line"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install the harness
        working-directory: e2e/relay-live
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
      - name: Load the relay client under Node and Orbit.exe
        working-directory: e2e/relay-live
        shell: bash
        env:
          WINK_RESOURCES: ${{ runner.temp }}/wink/resources
          OUT_DIR: ${{ runner.temp }}/artifacts
          WORK_DIR: ${{ runner.temp }}/work
        run: node diagnose.mjs
      - name: Run the phone access flow
        working-directory: e2e/relay-live
        shell: bash
        env:
          RELAY_E2E_CODE: ${{ secrets.RELAY_E2E_CODE }}
          ACME_MODE: ${{ inputs.acme }}
          STOP_AFTER_B: ${{ inputs.stop_after_b }}
          WINK_RESOURCES: ${{ runner.temp }}/wink/resources
          OUT_DIR: ${{ runner.temp }}/artifacts
          WORK_DIR: ${{ runner.temp }}/work
        run: node run.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: relay-live-e2e
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: warn
          retention-days: 7

  keep-awake:
    name: Full app keep awake
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_awake }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version || '1.0.147' }}
      RELEASE_RUN: ${{ inputs.release_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Download the installer and check it against latest.yml
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/artifacts"
          cd "$RUNNER_TEMP/release"
          if [ -n "$RELEASE_RUN" ]; then
            gh run download "$RELEASE_RUN" -R aiedwardyi/Orbit -n windows-release -D .
          else
            base="https://github.com/aiedwardyi/orbit-releases/releases/download/v$VERSION"
            curl -fsSL --retry 3 -o "Wink-$VERSION-setup.exe" "$base/Wink-$VERSION-setup.exe"
            curl -fsSL --retry 3 -o latest.yml "$base/latest.yml"
          fi
          ls -l
          node --input-type=module - <<'EOF'
          import { createHash } from "node:crypto";
          import { appendFileSync, readFileSync, statSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const feed = readFileSync("latest.yml", "utf8");
          const version = /^version:\s+(\S+)/m.exec(feed)?.[1] ?? null;
          const run = process.env.RELEASE_RUN;
          const exe = `Wink-${run ? version : process.env.VERSION}-setup.exe`;
          const entry = [...feed.matchAll(/url:\s+(\S+)[\s\S]*?sha512:\s+(\S+)\n\s+size:\s+(\d+)/g)].find(([, url]) => url === exe);
          if (!entry) { console.error(`latest.yml does not list ${exe}`); process.exit(1); }
          const actual = createHash("sha512").update(readFileSync(exe)).digest("base64");
          const size = statSync(exe).size;
          const result = {
            source: run ? `release.yml run ${run} (windows-release artifact)` : `orbit-releases v${process.env.VERSION}`,
            exe,
            version,
            sha512Match: actual === entry[2],
            sizeMatch: size === Number(entry[3]),
            size,
            sha512Prefix: actual.slice(0, 16),
          };
          writeFileSync(`${process.env.RUNNER_TEMP}/artifacts/a-release.json`, `${JSON.stringify(result, null, 2)}\n`);
          console.log(JSON.stringify(result));
          if (!result.sha512Match || !result.sizeMatch || !version || (!run && version !== process.env.VERSION)) process.exit(1);
          appendFileSync(process.env.GITHUB_ENV, `INSTALLER=${join(process.cwd(), exe)}\nBITS=${result.source}, Wink ${version}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `**Bits:** ${result.source}, \`${exe}\` (Wink ${version}), sha512 and size match its latest.yml\n\n`);
          EOF
      - name: Extract the installer
        shell: bash
        run: |
          7z x -y -o"$RUNNER_TEMP/nsis" "$INSTALLER" > /dev/null
          app=$(find "$RUNNER_TEMP/nsis" -name 'app-64.7z' | head -n 1)
          [ -n "$app" ] || { echo "::error::no app-64.7z in the installer"; exit 1; }
          7z x -y -o"$RUNNER_TEMP/wink" "$app" > /dev/null
          [ -f "$RUNNER_TEMP/wink/Orbit.exe" ] || { echo "::error::missing Orbit.exe"; exit 1; }
      - name: Install the harness
        working-directory: e2e/relay-live
        shell: bash
        run: |
          node --check keep-awake.mjs
          npm install --no-audit --no-fund
      - name: Check the full app's Windows power request
        working-directory: e2e/relay-live
        shell: bash
        env:
          RELAY_E2E_CODE: ${{ secrets.RELAY_E2E_CODE }}
          ACME_MODE: ${{ inputs.acme }}
          WINK_EXE: ${{ runner.temp }}/wink/Orbit.exe
          OUT_DIR: ${{ runner.temp }}/artifacts
          WORK_DIR: ${{ runner.temp }}/keep-awake
        run: node keep-awake.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && env.KEEP_AWAKE_ARTIFACTS_SAFE == 'true' }}
        with:
          name: relay-keep-awake-e2e
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: warn
          retention-days: 7
