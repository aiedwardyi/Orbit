# One-button Windows releases from one pinned commit, with a verified feed
# assembled on aiedwardyi/orbit-releases.
#
# Every gate below exists because its absence shipped (or nearly shipped) a
# broken build from a laptop:
#   - clean output dirs        -> 0.1.15 "app is damaged" (stale dist/ broke the seal)
#   - codesign gate BEFORE     -> notarization ACCEPTS invalid signatures
#   - packaged-server smoke    -> 0.1.24 died on launch (unbundled zod import)
#   - proxy-path probe         -> the 0.1.24 fix broke every helper while
#                                 /api/health stayed green
#   - staple, THEN hash        -> stapling rewrites bytes; stale feeds make
#                                 electron-updater reject every update
#   - blockmap regeneration    -> stale differential maps waste every updater's
#                                 bandwidth silently
#   - assemble-then-publish    -> 0.1.24 sat as an invisible draft; a mac-only
#                                 publish 404s the README's other buttons
#
# One-time setup (repo secrets) is documented in docs/releasing.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to release (defaults to the branch this runs from)"
        required: false
        type: string
      publish:
        description: "Publish immediately after assembly (otherwise leave a draft for review)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    name: Pin the release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - id: pin
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite a published release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if gh release view "$v" --repo aiedwardyi/orbit-releases --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$v is already published on orbit-releases - bump the version first"
            exit 1
          fi

  windows:
    name: Windows x64
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        shell: bash
        run: rm -rf dist dist-server release
      - run: pnpm package:win
      - name: Verify the packaged tree and start the packaged server
        shell: bash
        run: |
          res=release/win-unpacked/resources
          [ -f "$res/server/packaged-boot.js" ] || { echo "::error::missing server/packaged-boot.js"; exit 1; }
          [ -f "$res/server/index.js" ] || { echo "::error::missing server/index.js"; exit 1; }
          [ -f "$res/ui/index.html" ] || { echo "::error::missing ui/index.html"; exit 1; }
          [ -f "$res/cloudflared/cloudflared.exe" ] || { echo "::error::missing cloudflared.exe"; exit 1; }
          [ -f "$res/licenses/cloudflared-LICENSE.txt" ] || { echo "::error::missing cloudflared license"; exit 1; }
          [ -f "$res/licenses/cloudflared-README.md" ] || { echo "::error::missing cloudflared provenance"; exit 1; }
          expected=c29eee2b121f5436a642eed69fd9767da7e7b8c510fa50aaa130337f931357b5
          actual=$(sha256sum "$res/cloudflared/cloudflared.exe" | cut -d' ' -f1)
          [ "$actual" = "$expected" ] || { echo "::error::cloudflared hash is $actual"; exit 1; }
          "$res/cloudflared/cloudflared.exe" version | grep -Fq "cloudflared version 2026.8.2 " || {
            echo "::error::cloudflared has the wrong version"; exit 1; }
          [ -f "$res/app-update.yml" ] || { echo "::error::missing app-update.yml"; exit 1; }
          grep -q "owner: aiedwardyi" "$res/app-update.yml" || { echo "::error::wrong update owner"; exit 1; }
          grep -q "repo: orbit-releases" "$res/app-update.yml" || { echo "::error::wrong update repo"; exit 1; }
          if grep -Eq "openmausbot-releases|milind-soni" "$res/app-update.yml"; then
            echo "::error::app-update.yml still points at the upstream feed"; exit 1
          fi
          if grep -q "publisherName" "$res/app-update.yml"; then
            echo "::error::publisherName on an unsigned build breaks every update"; exit 1
          fi
          HOME="$RUNNER_TEMP/smoke" USERPROFILE="$RUNNER_TEMP/smoke" OMB_PORT=21987 \
            node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1 && { kill $pid; exit 0; }
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::the packaged server never served /api/health"
          cat "$RUNNER_TEMP/server.log" || true
          exit 1
      - name: Stable-named copy
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/Orbit-$v-setup.exe" release/Orbit-setup.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble the Windows draft and verify its feed
    needs: [prepare, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Verify the Windows feed hash against the actual bytes
        run: |
          cd assets
          node --input-type=module - <<'EOF'
          import { createHash } from "node:crypto";
          import { readFileSync, readdirSync, statSync, existsSync } from "node:fs";
          const sha512 = (f) => createHash("sha512").update(readFileSync(f)).digest("base64");
          let bad = 0;
          let entries = 0;
          const feed = "latest.yml";
          if (!existsSync(feed)) { console.error(`MISSING ${feed}`); process.exit(1); }
          const text = readFileSync(feed, "utf8");
          for (const [, url, hash, size] of text.matchAll(/url:\s+(\S+)[\s\S]*?sha512:\s+(\S+)\n\s+size:\s+(\d+)/g)) {
            entries++;
            if (!existsSync(url)) { console.error(`MISSING ${url} (listed in ${feed})`); bad++; continue; }
            const okHash = sha512(url) === hash;
            const okSize = statSync(url).size === Number(size);
            if (!okHash || !okSize) { console.error(`MISMATCH ${url} in ${feed}`); bad++; }
            else console.log(`ok ${url}`);
          }
          if (!entries) { console.error(`NO ASSETS listed in ${feed}`); process.exit(1); }
          if (bad) process.exit(1);
          console.log(`\nWindows feed verified; ${readdirSync(".").length} assets staged`);
          EOF
      - name: Create or update the draft with the complete asset set
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          cd assets
          tag="v$VERSION"
          if ! gh release view "$tag" --repo aiedwardyi/orbit-releases > /dev/null 2>&1; then
            gh release create "$tag" --repo aiedwardyi/orbit-releases \
              --draft --title "Orbit $VERSION" \
              --notes "Draft assembled by the release workflow from aiedwardyi/Orbit@$SHA. Edit these notes, then publish."
          fi
          while IFS= read -r name; do
            [ -n "$name" ] && [ ! -e "$name" ] && gh release delete-asset "$tag" "$name" --repo aiedwardyi/orbit-releases --yes
          done < <(gh release view "$tag" --repo aiedwardyi/orbit-releases --json assets --jq '.assets[].name')
          for f in *; do
            gh release upload "$tag" "$f" --repo aiedwardyi/orbit-releases --clobber
          done
          echo "asset count: $(gh release view "$tag" --repo aiedwardyi/orbit-releases --json assets --jq '.assets | length')"

      - name: Publish (only when asked to)
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release edit "v$VERSION" --repo aiedwardyi/orbit-releases --draft=false --latest
          # A draft that looks published is the 0.1.24 failure mode. Verify it.
          gh release view "v$VERSION" --repo aiedwardyi/orbit-releases --json isDraft --jq .isDraft | grep -q false
          echo "v$VERSION is live"
