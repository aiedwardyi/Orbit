<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="referrer" content="strict-origin" />
    <meta name="robots" content="noindex" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; img-src 'self'; connect-src https://relay.wink.edwardyi.dev https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    />
    <title>Wink team</title>
    <link rel="stylesheet" href="/team/team.css" />
  </head>
  <body>
    <main>
      <h1>Team</h1>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div id="google"></div>
      <table id="team" hidden>
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Last seen</th>
            <th scope="col" class="num">Today</th>
            <th scope="col">14 days</th>
            <th scope="col" class="num">Phone</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <a class="privacy" href="/privacy">Privacy</a>
    </main>
    <script async src="https://accounts.google.com/gsi/client"></script>
    <script src="/signin/config.js"></script>
    <script src="/team/team.js"></script>
  </body>
</html>
