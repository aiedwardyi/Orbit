<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121316" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <title>Wink</title>
    <script>
      // The skin's webfont would otherwise start loading only after the bundle renders text.
      try {
        var font = { wink: "SpaceGrotesk", "wink-cyber": "IBMPlexSans", "wink-violet": "Nunito", "wink-black": "JetBrainsMono", "wink-day": "Manrope", instrument: "IBMPlexSans", matte: "Nunito", carbon: "JetBrainsMono", pewter: "Manrope", "pewter-dusk": "Manrope", "pewter-night": "Manrope", coal: "SpaceGrotesk", folio: "Literata" }[localStorage.getItem("omb-skin")];
        if (font) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "font";
          link.type = "font/woff2";
          link.crossOrigin = "anonymous";
          link.href = "/fonts/" + font + "-Variable.woff2";
          document.head.appendChild(link);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
